
#cloud-config

package_update: true

packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Week 7 - Infrastructure as Code</title>
      </head>
      <body>
        <h1>Hello, ${student_name}!</h1>
        <p>${page_message}</p>
        <p>This web server was configured with cloud-init and deployed using OpenTofu.</p>
      </body>
      </html>

runcmd:
  - systemctl enable apache2
  - systemctl start apache2
